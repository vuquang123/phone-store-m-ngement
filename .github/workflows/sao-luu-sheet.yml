# Sao lưu Supabase -> Google Sheet mỗi 6 tiếng (00:00, 06:00, 12:00, 18:00 giờ VN).
# Vercel gói Hobby chỉ cho cron 1 lần/ngày nên dùng GitHub Actions để gọi endpoint.
# Cần 2 secret trong GitHub (Settings > Secrets and variables > Actions):
#   APP_URL      vd https://ten-app.vercel.app (không có dấu / ở cuối)
#   CRON_SECRET  giống hệt biến CRON_SECRET trên Vercel
name: Sao lưu Supabase về Google Sheet

on:
  schedule:
    - cron: "0 5,11,17,23 * * *" # UTC = 12h, 18h, 0h, 6h giờ VN
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gọi /api/cron/sao-luu-sheet
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Thiếu secret APP_URL hoặc CRON_SECRET"; exit 1
          fi
          code=$(curl -sS -o out.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/sao-luu-sheet")
          cat out.json; echo
          [ "$code" = "200" ] || { echo "HTTP $code"; exit 1; }
